<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador interno por cédula</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FBF6F9;--card:#FFFFFF;--ink:#0C1B29;--muted:#55616E;--line:#E7D8E1;
  --accent:#EF75A8;--accent-ink:#0C1B29;--link:#B01E68;--focus:#0C1B29;--tint:#FCE9F2;--band2:#0C1B29;
  --ok:#1E7A4C;--warn:#C25100;--bad:#B3261E;--neu:#3F5F7F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1520;--card:#132230;--ink:#F4EAF0;--muted:#A9B6C2;--line:#2A3C4B;
    --accent:#F08CBA;--accent-ink:#0C1B29;--link:#F6A6CA;--focus:#F6A6CA;--tint:#1E2F3F;--band2:#3A5873;
    --ok:#5FCB92;--warn:#FFA040;--bad:#F08A82;--neu:#8DB0D3;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1520;--card:#132230;--ink:#F4EAF0;--muted:#A9B6C2;--line:#2A3C4B;
  --accent:#F08CBA;--accent-ink:#0C1B29;--link:#F6A6CA;--focus:#F6A6CA;--tint:#1E2F3F;--band2:#3A5873;
  --ok:#5FCB92;--warn:#FFA040;--bad:#F08A82;--neu:#8DB0D3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
body::before{content:"";display:block;height:8px;background:linear-gradient(90deg,var(--accent) 0 72%,var(--band2) 72% 100%)}
main{max-width:38rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.top{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.logo{flex:none;width:88px;height:88px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:4px}
h1{font-size:1.45rem;line-height:1.2;margin:0 0 .25rem;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.card h2{font-size:1.05rem;margin:0 0 .5rem;font-weight:700}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
button,.file{font:inherit;font-weight:600;padding:.65rem 1rem;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.alt,.file{background:transparent;color:var(--link);border-color:var(--link)}
button:disabled{opacity:.5;cursor:not-allowed}
.file input{display:none}
input[type=search]{flex:1;min-width:10rem;font:inherit;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.msg{font-size:.9rem;color:var(--muted);margin:.5rem 0 0}
.msg.bad{color:var(--bad)}
dl{margin:0;display:grid;grid-template-columns:minmax(7rem,max-content) 1fr;gap:.5rem 1rem}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:999px;border:1px solid var(--c);color:var(--c);font-weight:600}
.mask{background:none;border:0;padding:0 0 0 .5rem;color:var(--link);text-decoration:underline;font-weight:400}
.contact{border-left:6px solid var(--accent)}
.contact a{color:var(--link);font-weight:800;font-size:1.25rem}
.note{font-size:.85rem;color:var(--muted)}
</style>
</head>

    return s;
  }
  function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
  function digits(s){return String(s).replace(/\D/g,"")}
  function tone(v){
    var n=norm(v);
    if(!n||n.indexOf("sin")===0||n.indexOf("no")===0)return"var(--neu)";
    if(/suspend|devol|rechaz|cancel|incumpl/.test(n))return"var(--bad)";
    if(/pend|proceso|revis|program/.test(n))return"var(--warn)";
    if(/aldia|complet|entregad|aprobad|activ|pagad/.test(n))return"var(--ok)";
    return"var(--neu)";
  }

  function suave(v){var s=String(v);return(s===s.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]/.test(s))?s.charAt(0)+s.slice(1).toLowerCase():s}
  var ETIQ={aldia:"Al día",pendiente:"Pendiente",devolucion:"Devolución"};
  function estadoTxt(v){var t=fmt(v);return ETIQ[norm(t)]||suave(t)}
  function propio(s){var P={de:1,del:1,la:1,las:1,los:1,y:1,e:1};return String(s).toLowerCase().split(" ").map(function(w,i){return(i>0&&P[w])?w:w.charAt(0).toUpperCase()+w.slice(1)}).join(" ")}

  var DATA=BASE.map(function(r){return{
    nombre:propio(r.nombre),tel:fmt(r.telefono),cedula:String(r.cedula),cuenta:suave(fmt(r.cuenta)),
    bono:suave(fmt(r.auxilioBono)),araza:suave(fmt(r.bonoArazaAsociaciones||"")),proy:suave(fmt(r.proyectosHumanitarios)),entrega:suave(fmt(r.entregaFinal)),estado:estadoTxt(r.estado)
  }});

  function field(dl,label,value,pill){
    var dt=document.createElement("dt"),dd=document.createElement("dd");
    dt.textContent=label;
    if(pill){var p=document.createElement("span");p.className="pill";p.style.setProperty("--c",tone(value));p.textContent=value||"Sin dato";dd.appendChild(p)}
    else dd.textContent=value||"Sin dato";
    dl.appendChild(dt);dl.appendChild(dd);return dd;
  }

  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var q=digits($("q").value),out=$("out");out.innerHTML="";
    if(!q){$("qmsg").textContent="Escribe un número de cédula.";return}
    var r=DATA.filter(function(x){return digits(x.cedula)===q})[0];
    if(!r){$("qmsg").textContent="No hay registros para esa cédula. Verifica el número o comunícate con la dueña de la fundación.";return}
    $("qmsg").textContent="";
    var dl=document.createElement("dl");
    field(dl,"Nombre completo",r.nombre);
    field(dl,"Teléfono",r.tel);
    var masked=digits(r.cuenta).length>=4;
    var dd=field(dl,"Cuenta",masked?"•••• "+r.cuenta.slice(-4):r.cuenta);
    if(masked){
      var b=document.createElement("button");b.type="button";b.className="mask";b.textContent="Mostrar completa";
      var shown=false;
      b.onclick=function(){shown=!shown;dd.firstChild.nodeValue=shown?r.cuenta:"•••• "+r.cuenta.slice(-4);b.textContent=shown?"Ocultar":"Mostrar completa"};
      dd.appendChild(b);
    }
    field(dl,"Auxilio de Bono",r.bono);
    field(dl,"Bono Araza, Asociaciones",r.araza);
    field(dl,"Proyectos Humanitarios",r.proy);
    field(dl,"Entrega final",r.entrega);
    field(dl,"Estado",r.estado,true);
    out.appendChild(dl);
  });
})();
</script>
</body>
</html>
